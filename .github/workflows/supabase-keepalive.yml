name: Supabase Keep Alive

on:
  schedule:
    # Runs every 3 days at 2:17 AM UTC
    - cron: '17 2 */3 * *'

  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Query Supabase
        run: |
          curl -s \
          "${{ secrets.SUPABASE_URL }}/rest/v1/pin_id_table?select=pin_number&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
